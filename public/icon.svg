<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="habinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#habinoGrad)" />
  
  <!-- Grid Accent Lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Stylized Geometric "H" + Financial Growth Chart -->
  <g filter="url(#shadow)">
    <!-- Left Column of H -->
    <rect x="136" y="136" width="56" height="240" rx="24" fill="#ffffff" />
    
    <!-- Right Column of H (Elevated Bar) -->
    <rect x="320" y="136" width="56" height="240" rx="24" fill="#ffffff" />
    
    <!-- Central Bridge Bar of H -->
    <rect x="136" y="232" width="240" height="48" rx="20" fill="#ffffff" />
    
    <!-- Synapse AI / Financial Node (Emerald Dot & Pulse) -->
    <circle cx="256" cy="256" r="28" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
    
    <!-- Growth Arrow Accent -->
    <path d="M 320 180 L 376 124 M 376 124 L 340 124 M 376 124 L 376 160" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
